spring.application.name=bi-leads-api

# MongoDB: en local la base bi_leads; en el VPS llega por variable de entorno.
spring.mongodb.uri=${MONGO_URI:mongodb://127.0.0.1:27017/bi_leads}

# Acceso al dashboard (en el VPS se cambian por variables de entorno)
bi.clave=${BI_CLAVE:bi2026}
bi.secreto=${BI_SECRETO:solo-para-desarrollo-local}
bi.mes-por-defecto=2026-10

server.port=${PORT:8080}
spring.jackson.time-zone=America/Lima
