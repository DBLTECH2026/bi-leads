# Cliente estático + /api reenviado al contenedor de Spring Boot
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HTML, CSS y JS: el navegador siempre pregunta si cambió (si no cambió, responde 304 sin descargar)
    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # Fuentes, imágenes e íconos casi no cambian
    location ~* \.(woff2|webp|svg|png)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
